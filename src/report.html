<!doctype html>
<meta charset="utf-8">
<title>Data usage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --panel: #ffffff;
    --fg: #1d1d1f;
    --dim: #6e6e73;
    --faint: #a1a1a6;
    --rule: rgba(0,0,0,.09);
    --grid: rgba(0,0,0,.055);
    --hover: rgba(0,0,0,.05);
    --track: rgba(0,0,0,.07);
    --mobile: #ff9500;
    --wifi: #007aff;
    --wired: #34c759;
    --shadow: 0 1px 3px rgba(0,0,0,.09);
    --tip-bg: #ffffff;
    --tip-shadow: 0 6px 22px rgba(0,0,0,.20);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #262629;
      --fg: #f5f5f7;
      --dim: #9b9ba0;
      --faint: #6b6b70;
      --rule: rgba(255,255,255,.10);
      --grid: rgba(255,255,255,.06);
      --hover: rgba(255,255,255,.06);
      --track: rgba(255,255,255,.10);
      --mobile: #ff9f0a;
      --wifi: #0a84ff;
      --wired: #30d158;
      --shadow: none;
      --tip-bg: #323236;
      --tip-shadow: 0 6px 22px rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }

  .card {
    background: var(--panel); border-radius: 11px;
    padding: 11px 12px 12px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 10px; }

  /* Section label: small, quiet, with a value pinned to the right. */
  .cap {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 11px; color: var(--dim); letter-spacing: .04em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .cap b { font-weight: 600; }
  .cap .r { text-transform: none; letter-spacing: 0; color: var(--faint); }

  /* Hero: today's total is the one number worth reading from across the room. */
  /* Wraps rather than overflows when a wide total meets a narrow popover. */
  .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .hero .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .hero .split { font-size: 12px; color: var(--dim); }
  .hero .split span + span { margin-left: 10px; }

  /* Proportion bar — the mobile/Wi-Fi split as one glance, not a table. */
  .share {
    display: flex; height: 6px; border-radius: 3px; overflow: hidden;
    background: var(--track); margin: 11px 0 9px;
  }
  .share div { height: 100%; }

  .keys { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
  .keys .k { display: flex; align-items: center; gap: 6px; }
  .keys .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .keys .nm { color: var(--dim); }
  .keys .vl { font-weight: 500; }

  /* Charts */
  .plot { position: relative; height: 86px; }
  .grid { position: absolute; inset: 0; }
  .grid div { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
  .chart { position: relative; height: 100%; border-bottom: 1px solid var(--rule); }
  .chart svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .chart .line { fill: none; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
  .chart .guide { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 2 2; opacity: 0; }
  .chart .dot { stroke: var(--panel); stroke-width: 1.5; opacity: 0; }
  /* Transparent columns over the plot, one per period, carry the hover. */
  .chart .hits { position: absolute; inset: 0; display: flex; }
  .chart .hits div { flex: 1 1 0; }
  /* A fixed height, not one set by the labels: fit() measures the page before
     draw() fills them in, and an axis that is 0pt tall at that moment makes the
     charts grow by exactly the room the labels then take back. */
  .axis {
    display: flex; margin-top: 5px; height: 14px; line-height: 14px;
    font-size: 9.5px; color: var(--faint);
  }
  .axis span { flex: 1 1 0; text-align: center; white-space: nowrap; }
  .empty { color: var(--faint); font-size: 11px; height: 86px; display: grid; place-items: center; }

  footer {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 10px; padding: 0 2px;
    font-size: 11px; color: var(--faint);
  }

  #tip {
    position: absolute; pointer-events: none; opacity: 0;
    /* Parked inside the viewport until place() moves it. Left at its default
       spot after the footer, the invisible tooltip still counts toward the
       page's height and made the popover scroll by its own height. */
    top: 0; left: 0;
    transition: opacity .09s ease;
    background: var(--tip-bg); border-radius: 8px; box-shadow: var(--tip-shadow);
    padding: 9px 11px; font-size: 12px; min-width: 160px; z-index: 10;
  }
  #tip.show { opacity: 1; }
  #tip .when { font-weight: 600; margin-bottom: 6px; font-size: 12px; }
  #tip table { border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  #tip td { padding: 1.5px 0; }
  #tip td.k { color: var(--dim); padding-right: 16px; white-space: nowrap; }
  #tip td.v { text-align: right; font-weight: 500; }
  #tip tr.sub td.k { color: var(--faint); padding-left: 14px; }
  #tip tr.sub td.v { font-weight: 400; color: var(--dim); }
  #tip tr.tot td { border-top: 1px solid var(--rule); padding-top: 4px; }
  #tip .sw { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  /* The link line grows with detail (metered, low data mode, manual pin); if
     it ever outgrows the popover it truncates rather than wrapping. */
  footer #link { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<div class="card">
  <div class="cap"><b>Today</b><span class="r" id="date"></span></div>
  <div class="hero">
    <div class="big num" id="total"></div>
    <div class="split num" id="split"></div>
  </div>
  <div class="share" id="share"></div>
  <div class="keys" id="keys"></div>
</div>

<div class="card">
  <div class="cap"><b>Last 24 hours</b><span class="r" id="cap-h"></span></div>
  <div class="plot"><div class="grid"></div><div class="chart" id="hours"></div></div>
  <div class="axis" id="axis-h"></div>
</div>

<div class="card">
  <div class="cap"><b>__DAYSLABEL__</b><span class="r" id="cap-d"></span></div>
  <div class="plot"><div class="grid"></div><div class="chart" id="days"></div></div>
  <div class="axis" id="axis-d"></div>
</div>

<footer>
  <span id="link"></span>
</footer>

<div id="tip"></div>

<script>
const TODAY = "__TODAY__";
const LINK  = "__LINK__";
const HOURS = "__HOURS__";
const DAYS  = "__DAYS__";
const CLASSES = [["mobile","Mobile"],["wifi","Wi-Fi"],["wired","Ethernet"]];
// Chart height when the popover gives exactly the room it was asked for.
const PLOT_H = 86;
const MIN_PLOT_H = 48;

function fmt(n) {
  const U = [["TB",1e12],["GB",1e9],["MB",1e6],["KB",1e3]];
  for (const [u,s] of U) {
    if (n >= s) { const x = n/s; return x.toFixed(x<10?2:x<100?1:0) + " " + u; }
  }
  return n + " B";
}
const total = d => CLASSES.reduce((a,[k]) => a + d[k][0] + d[k][1], 0);
const el = id => document.getElementById(id);
const tip = el("tip");

function head() {
  const t = TODAY.total[0] + TODAY.total[1];
  el("date").textContent = TODAY.date;
  el("total").textContent = fmt(t);
  el("split").innerHTML =
    `<span>↓ ${fmt(TODAY.total[0])}</span><span>↑ ${fmt(TODAY.total[1])}</span>`;

  const used = TODAY.rows.filter(r => r.rx + r.tx > 0);
  el("share").innerHTML = used
    .map(r => `<div style="background:var(--${r.key});width:${(r.rx+r.tx)/t*100}%"></div>`)
    .join("");
  // Always name mobile and Wi-Fi, even at zero — that split is the point of
  // the app, and an absent row reads as missing rather than as nothing used.
  el("keys").innerHTML = TODAY.rows
    .filter(r => r.key !== "wired" || r.rx + r.tx > 0)
    .map(r => `<span class="k"><i class="sw" style="background:var(--${r.key})"></i>` +
              `<span class="nm">${r.name}</span><span class="vl num">${fmt(r.rx+r.tx)}</span></span>`)
    .join("");
  el("link").textContent = LINK ? "Now on " + LINK : "Offline";
}

function showTip(evt, d) {
  const rows = CLASSES
    .filter(([k]) => d[k][0] + d[k][1] > 0)
    .map(([k,name]) =>
      `<tr><td class="k"><i class="sw" style="background:var(--${k})"></i>${name}</td>` +
      `<td class="v">${fmt(d[k][0]+d[k][1])}</td></tr>` +
      `<tr class="sub"><td class="k">↓ down</td><td class="v">${fmt(d[k][0])}</td></tr>` +
      `<tr class="sub"><td class="k">↑ up</td><td class="v">${fmt(d[k][1])}</td></tr>`)
    .join("");
  const t = total(d);
  if (!d.tracked) {
    tip.innerHTML = `<div class="when">${d.title}</div><div style="color:var(--faint)">Not tracked yet</div>`;
    tip.classList.add("show");
    place(evt);
    return;
  }
  tip.innerHTML = `<div class="when">${d.title}</div>` +
    (t === 0 ? `<div style="color:var(--faint)">No traffic</div>`
             : `<table>${rows}<tr class="tot"><td class="k">Total</td><td class="v">${fmt(t)}</td></tr></table>`);
  tip.classList.add("show");
  place(evt);
}

function place(evt) {
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > window.innerWidth - 6) x = evt.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 6) y = evt.clientY - r.height - pad;
  tip.style.left = (Math.max(6, x) + window.scrollX) + "px";
  tip.style.top = (Math.max(6, y) + window.scrollY) + "px";
}

function draw(data, chartId, axisId, capId, everyNth) {
  const chart = el(chartId);
  el(axisId).innerHTML = "";
  if (!chart) return; // already replaced by the empty-state placeholder
  // Mobile and Wi-Fi always get a line — the split is the point of the app.
  // Ethernet only when something used it.
  const active = CLASSES.filter(([k]) =>
    k !== "wired" || data.some(d => d[k][0] + d[k][1] > 0));
  const val = (d, k) => d[k][0] + d[k][1];
  const peak = Math.max(...data.flatMap(d => active.map(([k]) => val(d, k))), 0);
  const sum = data.reduce((a,d) => a + total(d), 0);
  // Naming the peak explains the scale: without it, one big hour makes every
  // other point look like nothing went on.
  el(capId).textContent = peak > 0 ? `${fmt(sum)} · peak ${fmt(peak)}` : "";

  // Tracking starts once and runs on, so the tracked periods are a suffix.
  const t0 = data.findIndex(d => d.tracked);
  if (peak === 0 || t0 < 0) {
    const plot = chart.closest(".plot");
    plot.outerHTML = `<div class="empty" style="height:${plot.style.height || PLOT_H + "px"}">No traffic recorded yet</div>`;
    return;
  }

  // Quarter gridlines give the empty upper area some structure.
  chart.previousElementSibling.innerHTML =
    [.25,.5,.75,1].map(f => `<div style="top:${(1-f)*100}%"></div>`).join("");

  const W = chart.clientWidth, H = chart.clientHeight, n = data.length;
  const x = i => (i + 0.5) * W / n;
  // Headroom so the stroke at the peak is not clipped by the top edge.
  const y = v => H - 1 - (v / peak) * (H - 4);
  const f1 = v => v.toFixed(1);

  let svg = `<svg width="${W}" height="${H}"><defs>`;
  for (const [k] of active) {
    svg += `<linearGradient id="g-${chartId}-${k}" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0" style="stop-color:var(--${k});stop-opacity:.30"/>` +
      `<stop offset="1" style="stop-color:var(--${k});stop-opacity:0"/></linearGradient>`;
  }
  svg += `</defs>`;
  // Lines start at the first tracked period. Before it there is no data, and
  // a line along zero would say there was no traffic. Wi-Fi is drawn first so
  // mobile — the series worth not losing — sits on top where they cross.
  for (const [k] of [...active].reverse()) {
    const pts = [];
    for (let i = t0; i < n; i++) pts.push(`${f1(x(i))},${f1(y(val(data[i], k)))}`);
    if (pts.length === 1) {
      // A single period has no segment to draw; mark the point instead.
      svg += `<circle cx="${f1(x(t0))}" cy="${f1(y(val(data[t0], k)))}" r="2.5" style="fill:var(--${k})"/>`;
      continue;
    }
    const line = "M" + pts.join(" L");
    const area = `${line} L${f1(x(n - 1))},${H} L${f1(x(t0))},${H} Z`;
    svg += `<path d="${area}" style="fill:url(#g-${chartId}-${k})"/>` +
           `<path class="line" d="${line}" style="stroke:var(--${k})"/>`;
  }
  svg += `<line class="guide" y1="0" y2="${H}"/>`;
  for (const [k] of active) svg += `<circle class="dot" data-k="${k}" r="3" style="fill:var(--${k})"/>`;
  svg += `</svg>`;

  chart.innerHTML = svg + `<div class="hits">` +
    data.map((_, i) => `<div data-i="${i}"></div>`).join("") + `</div>`;

  const guide = chart.querySelector(".guide");
  const dots = [...chart.querySelectorAll(".dot")];
  const clear = () => {
    guide.style.opacity = 0;
    dots.forEach(c => c.style.opacity = 0);
    tip.classList.remove("show");
  };
  chart.querySelectorAll("[data-i]").forEach(h => {
    const i = +h.dataset.i, d = data[i];
    h.addEventListener("mouseenter", e => {
      if (d.tracked) {
        guide.setAttribute("x1", x(i));
        guide.setAttribute("x2", x(i));
        guide.style.opacity = 1;
        dots.forEach(c => {
          c.setAttribute("cx", x(i));
          c.setAttribute("cy", y(val(d, c.dataset.k)));
          c.style.opacity = 1;
        });
      }
      showTip(e, d);
    });
    h.addEventListener("mousemove", place);
    h.addEventListener("mouseleave", clear);
  });

  data.forEach((d, i) => {
    const lab = document.createElement("span");
    lab.textContent = i % everyNth === 0 ? d.label : "";
    el(axisId).appendChild(lab);
  });
}

// The popover's height is the page's natural height at PLOT_H, which is right
// for a SwiftBar that draws nothing above the web view. Stock SwiftBar puts a
// 32pt title bar inside that height, so the page gets less than it asked for.
// Rather than scroll, the charts give up the difference between them — and
// take up any extra, so no build leaves an empty band under the footer.
function fit() {
  const plots = [...document.querySelectorAll(".plot, .empty")];
  plots.forEach(p => p.style.height = PLOT_H + "px");
  const spare = window.innerHeight - document.body.scrollHeight;
  const h = Math.max(MIN_PLOT_H, PLOT_H + spare / plots.length);
  plots.forEach(p => p.style.height = h + "px");
}

function render() {
  fit();
  draw(HOURS, "hours", "axis-h", "cap-h", 3);
  draw(DAYS, "days", "axis-d", "cap-d", 5);
}

head();
render();
// In case the web view is sized after the page first lays out.
window.addEventListener("resize", render);
</script>
