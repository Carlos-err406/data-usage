<!doctype html>
<meta charset="utf-8">
<title>Data usage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1d1d1f;
    --dim: #8e8e93;
    --rule: rgba(0,0,0,.12);
    --hover: rgba(0,0,0,.05);
    --mobile: #ff9500;
    --wifi: #007aff;
    --wired: #34c759;
    --tip-bg: rgba(250,250,250,.98);
    --tip-shadow: rgba(0,0,0,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --fg: #f5f5f7;
      --rule: rgba(255,255,255,.14);
      --hover: rgba(255,255,255,.07);
      --mobile: #ff9f0a;
      --wifi: #0a84ff;
      --wired: #30d158;
      --tip-bg: rgba(44,44,46,.98);
      --tip-shadow: rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px 16px;
    background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  h2 {
    margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--dim);
    letter-spacing: .02em;
  }
  .sub { margin: 0 0 8px; font-size: 11px; color: var(--dim); }
  section + section { margin-top: 18px; }
  .chart {
    display: flex; align-items: flex-end; gap: 1px;
    height: 110px; border-bottom: 1px solid var(--rule);
  }
  .col {
    flex: 1 1 0; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
    border-radius: 2px 2px 0 0; cursor: default; position: relative;
  }
  .col:hover { background: var(--hover); }
  .col.on { background: var(--hover); }
  .seg { width: 100%; }
  .seg.mobile { background: var(--mobile); }
  .seg.wifi   { background: var(--wifi); }
  .seg.wired  { background: var(--wired); }
  .seg:first-of-type { border-radius: 2px 2px 0 0; }
  .axis {
    display: flex; gap: 1px; margin-top: 4px;
    font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .axis span { flex: 1 1 0; text-align: center; overflow: hidden; }
  .legend {
    display: flex; gap: 14px; margin-top: 14px;
    font-size: 11px; color: var(--dim); align-items: center;
  }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  /* Left-clicking the icon opens this popover, so the menu — and the actions
     in it — are only reachable on right-click. Say so, or they are lost. */
  .legend .hint { margin-left: auto; opacity: .75; }
  .empty { color: var(--dim); font-size: 11px; padding: 34px 0; text-align: center; }
  header { margin-bottom: 18px; }
  .date { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .totals {
    border-spacing: 0; font-variant-numeric: tabular-nums;
    font-size: 12px; width: 100%; max-width: 380px;
  }
  .totals th {
    font-weight: 400; color: var(--dim); text-align: right;
    font-size: 11px; padding: 0 0 3px 14px;
  }
  .totals th:first-child { text-align: left; padding-left: 0; }
  .totals td { text-align: right; padding: 2px 0 2px 14px; }
  .totals td:first-child { text-align: left; padding-left: 0; }
  .totals tr.tot td { border-top: 1px solid var(--rule); color: var(--dim); padding-top: 4px; }
  .totals i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  .link { margin-top: 10px; font-size: 11px; color: var(--dim); }
  #tip {
    /* absolute rather than fixed: the page never scrolls, so the two behave
       identically, and position() adds the scroll offset regardless. */
    position: absolute; pointer-events: none; opacity: 0;
    transition: opacity .08s ease;
    background: var(--tip-bg); border-radius: 7px;
    box-shadow: 0 3px 14px var(--tip-shadow);
    padding: 8px 10px; font-size: 12px; min-width: 150px;
    border: 1px solid var(--rule); z-index: 10;
  }
  #tip.show { opacity: 1; }
  #tip .when { font-weight: 600; margin-bottom: 5px; }
  #tip table { border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  #tip td { padding: 1px 0; }
  #tip td.k { color: var(--dim); padding-right: 12px; }
  #tip td.v { text-align: right; }
  #tip tr.tot td { border-top: 1px solid var(--rule); padding-top: 3px; }
  #tip .dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 5px; }
</style>

<header>
  <div class="date" id="date"></div>
  <table class="totals" id="totals"></table>
  <div class="link" id="link"></div>
</header>

<section>
  <h2>Last 24 hours</h2>
  <p class="sub" id="sub-h"></p>
  <div class="chart" id="hours"></div>
  <div class="axis" id="axis-h"></div>
</section>

<section>
  <h2>Last 30 days</h2>
  <p class="sub" id="sub-d"></p>
  <div class="chart" id="days"></div>
  <div class="axis" id="axis-d"></div>
</section>

<div class="legend">
  <span><i style="background:var(--mobile)"></i>Mobile</span>
  <span><i style="background:var(--wifi)"></i>Wi-Fi</span>
  <span><i style="background:var(--wired)"></i>Ethernet</span>
  <span class="hint">Right-click the menu bar icon for settings</span>
</div>

<div id="tip"></div>

<script>
const TODAY = "__TODAY__";
const LINK  = "__LINK__";
const HOURS = "__HOURS__";
const DAYS  = "__DAYS__";
const CLASSES = [["mobile","Mobile"],["wifi","Wi-Fi"],["wired","Ethernet"]];

function fmt(n) {
  const U = [["TB",1e12],["GB",1e9],["MB",1e6],["KB",1e3]];
  for (const [u,s] of U) {
    if (n >= s) { const x = n/s; return x.toFixed(x<10?2:x<100?1:0) + " " + u; }
  }
  return n + " B";
}
const total = d => CLASSES.reduce((a,[k]) => a + d[k][0] + d[k][1], 0);

const tip = document.getElementById("tip");

function showTip(evt, d) {
  const rows = CLASSES
    .filter(([k]) => d[k][0] + d[k][1] > 0)
    .map(([k,name]) =>
      `<tr><td class="k"><i class="dot" style="background:var(--${k})"></i>${name}</td>` +
      `<td class="v">${fmt(d[k][0]+d[k][1])}</td></tr>` +
      `<tr><td class="k" style="padding-left:12px">↓ down</td><td class="v">${fmt(d[k][0])}</td></tr>` +
      `<tr><td class="k" style="padding-left:12px">↑ up</td><td class="v">${fmt(d[k][1])}</td></tr>`)
    .join("");
  const t = total(d);
  tip.innerHTML =
    `<div class="when">${d.title}</div>` +
    (t === 0 ? `<div style="color:var(--dim)">No traffic</div>`
             : `<table>${rows}<tr class="tot"><td class="k">Total</td><td class="v">${fmt(t)}</td></tr></table>`);
  tip.classList.add("show");
  position(evt);
}

function position(evt) {
  const pad = 12, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > window.innerWidth - 4) x = evt.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 4) y = evt.clientY - r.height - pad;
  // Viewport coords -> document coords, for absolute positioning.
  tip.style.left = (Math.max(4, x) + window.scrollX) + "px";
  tip.style.top = (Math.max(4, y) + window.scrollY) + "px";
}

function draw(data, chartId, axisId, subId, everyNth) {
  const chart = document.getElementById(chartId);
  const axis = document.getElementById(axisId);
  const peak = Math.max(...data.map(total), 0);
  const sum = data.reduce((a,d) => a + total(d), 0);
  document.getElementById(subId).textContent = fmt(sum) + " total";

  if (peak === 0) {
    chart.outerHTML = `<div class="empty">No traffic recorded yet</div>`;
    return;
  }

  data.forEach((d, i) => {
    const col = document.createElement("div");
    col.className = "col";
    // Stack downward in DOM order so mobile ends up at the bottom of the bar.
    for (const [k] of [...CLASSES].reverse()) {
      const v = d[k][0] + d[k][1];
      if (v === 0) continue;
      const seg = document.createElement("div");
      seg.className = "seg " + k;
      // Round up so a non-zero hour is never invisible.
      seg.style.height = Math.max(1, Math.ceil(v / peak * 110)) + "px";
      col.appendChild(seg);
    }
    col.addEventListener("mouseenter", e => { col.classList.add("on"); showTip(e, d); });
    col.addEventListener("mousemove", position);
    col.addEventListener("mouseleave", () => { col.classList.remove("on"); tip.classList.remove("show"); });
    chart.appendChild(col);

    const lab = document.createElement("span");
    lab.textContent = i % everyNth === 0 ? d.label : "";
    axis.appendChild(lab);
  });
}

function header() {
  document.getElementById("date").textContent = "Today · " + TODAY.date;
  const body = TODAY.rows
    .filter(r => r.rx + r.tx > 0 || r.key !== "wired")
    .map(r =>
      `<tr><td><i style="background:var(--${r.key})"></i>${r.name}</td>` +
      `<td>${fmt(r.rx + r.tx)}</td><td>${fmt(r.rx)}</td><td>${fmt(r.tx)}</td></tr>`)
    .join("");
  document.getElementById("totals").innerHTML =
    `<tr><th>&nbsp;</th><th>total</th><th>↓ down</th><th>↑ up</th></tr>` + body +
    `<tr class="tot"><td>Total</td><td>${fmt(TODAY.total[0]+TODAY.total[1])}</td>` +
    `<td>${fmt(TODAY.total[0])}</td><td>${fmt(TODAY.total[1])}</td></tr>`;
  document.getElementById("link").textContent = LINK ? "Now on " + LINK : "Offline";
}

header();
draw(HOURS, "hours", "axis-h", "sub-h", 3);
draw(DAYS, "days", "axis-d", "sub-d", 5);
</script>
